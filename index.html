<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masaaki Hasegawa</title>
    <script>
      document.documentElement.classList.add('js')
    </script>
  </head>
  <body>
    <header class="header">
      <a class="header__name header__name--first" href="/" aria-label="Masaaki Hasegawa — home">
        M<span class="header__name-rest">asaaki</span>
      </a>

      <!-- Burger (Mobile, Tablet, Laptop): opens into a panel with the same links -->
      <div class="header__menu menu">
        <div class="menu__panel">
          <button
            class="menu__toggle"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="menu-nav"
          >
            <span class="menu__toggle-line"></span>
            <span class="menu__toggle-line"></span>
          </button>

          <nav class="menu__nav nav nav--panel" id="menu-nav" aria-label="Main">
            <ul class="nav__list">
              <li class="nav__item" style="--i: 0"><a class="nav__link" href="#works">Works</a></li>
              <li class="nav__item" style="--i: 1"><a class="nav__link" href="#about">About</a></li>
              <li class="nav__item" style="--i: 2"><a class="nav__link" href="#events">Events</a></li>
              <li class="nav__item" style="--i: 3"><a class="nav__link" href="#video">Video</a></li>
              <li class="nav__item" style="--i: 4"><a class="nav__link" href="#contact">Contact</a></li>
            </ul>
          </nav>
        </div>
      </div>

      <!-- Nav bar (Desktop) -->
      <nav class="header__nav nav nav--bar" aria-label="Main">
        <ul class="nav__list">
          <li class="nav__item"><a class="nav__link" href="#works">Works</a></li>
          <li class="nav__item"><a class="nav__link" href="#about">About</a></li>
          <li class="nav__item"><a class="nav__link" href="#events">Events</a></li>
          <li class="nav__item"><a class="nav__link" href="#video">Video</a></li>
          <li class="nav__item"><a class="nav__link" href="#contact">Contact</a></li>
        </ul>
      </nav>

      <span class="header__name header__name--last" aria-hidden="true">
        H<span class="header__name-rest">asegawa</span>
      </span>
    </header>

    <main class="page">
      <!--
        Hero title, also the page loader (src/animations/loader.js):
        "Creation / in chaos" fill with ink as the page loads, then part to let
        the middle line in. The fill copies are decoration only.
      -->
      <section class="hero" aria-label="Intro">
        <h1 class="hero__title">
          <span class="hero__line hero__line--first">
            <span class="hero__word">
              Creation
              <span class="hero__fill" aria-hidden="true"><span class="hero__fill-text">Creation</span></span>
            </span>
          </span>
          <span class="hero__line hero__line--middle">
            <span class="hero__middle-text">is building a structure</span>
          </span>
          <span class="hero__line hero__line--last">
            <span class="hero__word">
              in chaos
              <span class="hero__fill" aria-hidden="true"><span class="hero__fill-text">in chaos</span></span>
            </span>
          </span>
        </h1>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
