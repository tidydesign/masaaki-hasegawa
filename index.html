<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masaaki Hasegawa</title>
    <script>
      document.documentElement.classList.add('js')
    </script>
  </head>
  <body>
    <header class="header">
      <a class="header__name header__name--first" href="/" aria-label="Masaaki Hasegawa — home">
        M<span class="header__name-rest">asaaki</span>
      </a>

      <!-- Burger (Mobile, Tablet, Laptop): opens into a panel with the same links -->
      <div class="header__menu menu">
        <div class="menu__panel">
          <button
            class="menu__toggle"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="menu-nav"
          >
            <span class="menu__toggle-line"></span>
            <span class="menu__toggle-line"></span>
          </button>

          <nav class="menu__nav nav nav--panel" id="menu-nav" aria-label="Main">
            <ul class="nav__list">
              <li class="nav__item" style="--i: 0"><a class="nav__link" href="#works">Works</a></li>
              <li class="nav__item" style="--i: 1"><a class="nav__link" href="#about">About</a></li>
              <li class="nav__item" style="--i: 2"><a class="nav__link" href="#events">Events</a></li>
              <li class="nav__item" style="--i: 3"><a class="nav__link" href="#video">Video</a></li>
              <li class="nav__item" style="--i: 4"><a class="nav__link" href="#contact">Contact</a></li>
            </ul>
          </nav>
        </div>
      </div>

      <!-- Nav bar (Desktop) -->
      <nav class="header__nav nav nav--bar" aria-label="Main">
        <ul class="nav__list">
          <li class="nav__item"><a class="nav__link" href="#works">Works</a></li>
          <li class="nav__item"><a class="nav__link" href="#about">About</a></li>
          <li class="nav__item"><a class="nav__link" href="#events">Events</a></li>
          <li class="nav__item"><a class="nav__link" href="#video">Video</a></li>
          <li class="nav__item"><a class="nav__link" href="#contact">Contact</a></li>
        </ul>
      </nav>

      <span class="header__name header__name--last" aria-hidden="true">
        H<span class="header__name-rest">asegawa</span>
      </span>
    </header>

    <main class="page">
      <!--
        Hero title, also the page loader (src/animations/loader.js):
        "Creation / in chaos" fill with ink as the page loads, then part to let
        the middle line in. The fill copies are decoration only.
      -->
      <section class="hero" aria-label="Intro">
        <h1 class="hero__title">
          <span class="hero__line hero__line--first">
            <span class="hero__word">
              Creation
              <span class="hero__fill" aria-hidden="true"><span class="hero__fill-text">Creation</span></span>
            </span>
          </span>
          <span class="hero__line hero__line--middle">
            <span class="hero__middle-part"><span class="hero__middle-text">is building</span></span>
            <span class="hero__middle-part"><span class="hero__middle-text">a structure</span></span>
          </span>
          <span class="hero__line hero__line--last">
            <span class="hero__word">
              in chaos
              <span class="hero__fill" aria-hidden="true"><span class="hero__fill-text">in chaos</span></span>
            </span>
          </span>
        </h1>
      </section>

      <!-- Works: one block per project, the gallery loops right to left and can be dragged -->
      <section class="works" id="works" aria-label="Works">
        <article class="project">
          <h2 class="project__heading">
            <span class="project__year">2026</span>
            <span class="project__title">Flower Rites</span>
          </h2>
          <div class="project__gallery">
            <ul class="project__track">
              <li class="project__item"><img class="project__image" src="/src/assets/images/projects/flower-rites/01.jpg" width="745" height="960" alt="Flower Rites, work 1" loading="lazy" decoding="async" draggable="false" /></li>
              <li class="project__item"><img class="project__image" src="/src/assets/images/projects/flower-rites/02.jpg" width="725" height="960" alt="Flower Rites, work 2" loading="lazy" decoding="async" draggable="false" /></li>
              <li class="project__item"><img class="project__image" src="/src/assets/images/projects/flower-rites/03.jpg" width="840" height="844" alt="Flower Rites, work 3" loading="lazy" decoding="async" draggable="false" /></li>
              <li class="project__item"><img class="project__image" src="/src/assets/images/projects/flower-rites/04.jpg" width="817" height="959" alt="Flower Rites, work 4" loading="lazy" decoding="async" draggable="false" /></li>
              <li class="project__item"><img class="project__image" src="/src/assets/images/projects/flower-rites/05.jpg" width="807" height="960" alt="Flower Rites, work 5" loading="lazy" decoding="async" draggable="false" /></li>
              <li class="project__item"><img class="project__image" src="/src/assets/images/projects/flower-rites/06.jpg" width="682" height="889" alt="Flower Rites, work 6" loading="lazy" decoding="async" draggable="false" /></li>
              <li class="project__item"><img class="project__image" src="/src/assets/images/projects/flower-rites/07.jpg" width="682" height="889" alt="Flower Rites, work 7" loading="lazy" decoding="async" draggable="false" /></li>
              <li class="project__item"><img class="project__image" src="/src/assets/images/projects/flower-rites/08.jpg" width="675" height="959" alt="Flower Rites, work 8" loading="lazy" decoding="async" draggable="false" /></li>
              <li class="project__item"><img class="project__image" src="/src/assets/images/projects/flower-rites/09.jpg" width="638" height="871" alt="Flower Rites, work 9" loading="lazy" decoding="async" draggable="false" /></li>
              <li class="project__item"><img class="project__image" src="/src/assets/images/projects/flower-rites/10.jpg" width="840" height="840" alt="Flower Rites, work 10" loading="lazy" decoding="async" draggable="false" /></li>
              <li class="project__item"><img class="project__image" src="/src/assets/images/projects/flower-rites/11.jpg" width="840" height="840" alt="Flower Rites, work 11" loading="lazy" decoding="async" draggable="false" /></li>
              <li class="project__item"><img class="project__image" src="/src/assets/images/projects/flower-rites/12.jpg" width="735" height="959" alt="Flower Rites, work 12" loading="lazy" decoding="async" draggable="false" /></li>
              <li class="project__item"><img class="project__image" src="/src/assets/images/projects/flower-rites/13.jpg" width="735" height="959" alt="Flower Rites, work 13" loading="lazy" decoding="async" draggable="false" /></li>
              <li class="project__item"><img class="project__image" src="/src/assets/images/projects/flower-rites/14.jpg" width="720" height="960" alt="Flower Rites, work 14" loading="lazy" decoding="async" draggable="false" /></li>
            </ul>
          </div>
        </article>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
